{% extends "dictionary/base.html" %}
{% block title %}Наборы карточек{% endblock %}
{% block content %}
<section class="section">

  {% if sets %}
  <div class="grid grid-3 section">{% for s in sets %}{% include "dictionary/_set_card.html" %}{% endfor %}</div>

</section>
{% endblock %}
