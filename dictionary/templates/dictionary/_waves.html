{# Декоративные «ленты» в стиле референса. variant: hero | dark | panel | auth #}
<svg class="waves" viewBox="0 0 400 400" fill="none" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">
{% if variant == "hero" %}
  <path d="M430 40 C330 40 300 130 240 150 S120 120 110 220 S220 330 180 430" stroke="#5cc8db" stroke-width="44" stroke-linecap="round"/>
  <path d="M440 210 C360 210 340 290 280 300 S200 260 190 330 S250 400 230 460" stroke="#0f2a8a" stroke-width="30" stroke-linecap="round" opacity=".55"/>
{% elif variant == "dark" %}
  <path d="M-30 90 C70 90 110 20 200 40 S310 170 230 230 S90 260 120 330 S300 380 440 330" stroke="#2c5cf0" stroke-width="54" stroke-linecap="round"/>
  <path d="M300 -30 C300 40 380 60 360 130 S260 170 300 230" stroke="#5cc8db" stroke-width="22" stroke-linecap="round"/>
{% elif variant == "panel" %}
  <path d="M-20 300 C60 300 80 200 160 200 S250 300 320 260 S360 120 440 120" stroke="#5cc8db" stroke-width="40" stroke-linecap="round"/>
  <path d="M40 -20 C40 80 140 70 160 140 S100 230 60 260" stroke="#2c5cf0" stroke-width="40" stroke-linecap="round"/>
  <text x="34" y="370" fill="#fff" font-family="Unbounded, sans-serif" font-weight="700" font-size="64">EN</text>
{% else %}
  <path d="M-30 80 C80 80 60 200 160 210 S300 120 330 200 S260 340 440 360" stroke="#5cc8db" stroke-width="40" stroke-linecap="round" opacity=".9"/>
  <path d="M-30 260 C60 260 80 330 160 330 S260 270 440 290" stroke="#0f2a8a" stroke-width="28" stroke-linecap="round" opacity=".6"/>
{% endif %}
</svg>
